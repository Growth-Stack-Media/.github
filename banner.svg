<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Growth Stack Media. Market, Grow, Scale." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06173A"/>
      <stop offset="0.55" stop-color="#0A2A66"/>
      <stop offset="1" stop-color="#0B3A8C"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E8BFF"/>
      <stop offset="1" stop-color="#0E4DB8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FB3FF"/>
      <stop offset="1" stop-color="#1769E0"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#16A34A"/>
      <stop offset="1" stop-color="#8BE02B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2E8BFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2E8BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5EA2FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="400" rx="18"/></clipPath>
  </defs>

  <style>
    text { font-family: "Montserrat","Segoe UI","Helvetica Neue",Arial,sans-serif; }
    .cycle { animation-duration: 8s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(.22,.8,.3,1); }
    .mark  { animation-name: markfade; }
    .ring  { stroke-dasharray: 470; animation-name: ringdraw; }
    .bar   { transform-box: fill-box; transform-origin: 50% 100%; }
    .b1 { animation-name: grow1; } .b2 { animation-name: grow2; }
    .b3 { animation-name: grow3; } .b4 { animation-name: grow4; }
    .line  { stroke-dasharray: 80; animation-name: linedraw; }
    .head  { transform-box: fill-box; transform-origin: 20% 80%; animation-name: headpop; }
    .halo  { animation: pulse 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .ticker { animation: slide 32s linear infinite; }
    .dot   { animation: blink 8s ease-in-out infinite; }

    @keyframes markfade { 0%{opacity:0} 3%{opacity:1} 92%{opacity:1} 98%{opacity:0} 100%{opacity:0} }
    @keyframes ringdraw { 0%{stroke-dashoffset:470} 22%{stroke-dashoffset:0} 100%{stroke-dashoffset:0} }
    @keyframes grow1 { 0%,10%{transform:scaleY(0)} 22%,100%{transform:scaleY(1)} }
    @keyframes grow2 { 0%,14%{transform:scaleY(0)} 26%,100%{transform:scaleY(1)} }
    @keyframes grow3 { 0%,18%{transform:scaleY(0)} 30%,100%{transform:scaleY(1)} }
    @keyframes grow4 { 0%,22%{transform:scaleY(0)} 34%,100%{transform:scaleY(1)} }
    @keyframes linedraw { 0%,32%{stroke-dashoffset:80} 44%,100%{stroke-dashoffset:0} }
    @keyframes headpop { 0%,42%{opacity:0;transform:scale(.3)} 50%{opacity:1;transform:scale(1.15)} 56%,100%{opacity:1;transform:scale(1)} }
    @keyframes pulse { 0%,100%{opacity:.55;transform:scale(.92)} 50%{opacity:1;transform:scale(1.06)} }
    @keyframes slide { from{transform:translateX(0)} to{transform:translateX(-1400px)} }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

    @media (prefers-reduced-motion: reduce) {
      .cycle,.halo,.ticker,.dot { animation: none !important; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)"/>

    <!-- glow behind the mark -->
    <circle class="halo" cx="275" cy="190" r="190" fill="url(#glow)"/>

    <!-- animated mark -->
    <g class="cycle mark">
      <path class="cycle ring" d="M314.6 139.9 A85 85 0 1 0 344.7 212.4" fill="none" stroke="url(#ring)" stroke-width="34" stroke-linecap="butt"/>
      <path d="M298 212 H345" stroke="url(#ring)" stroke-width="30" fill="none"/>
      <rect class="cycle bar b1" x="205" y="212" width="18" height="28" rx="2" fill="url(#bar)"/>
      <rect class="cycle bar b2" x="229" y="194" width="18" height="46" rx="2" fill="url(#bar)"/>
      <rect class="cycle bar b3" x="253" y="174" width="18" height="66" rx="2" fill="url(#bar)"/>
      <rect class="cycle bar b4" x="277" y="152" width="18" height="88" rx="2" fill="url(#bar)"/>
      <path class="cycle line" d="M332 136 L392 86" fill="none" stroke="url(#arrow)" stroke-width="15" stroke-linecap="round"/>
      <polygon class="cycle head" points="416.6,65.5 401.6,97.5 382.4,74.5" fill="url(#arrow)"/>
    </g>

    <!-- wordmark -->
    <text x="470" y="150" font-size="66" font-weight="800" fill="#FFFFFF">GROWTH <tspan fill="#3B9BFF">STACK</tspan></text>
    <line x1="472" y1="186" x2="560" y2="186" stroke="#7FB6FF" stroke-opacity="0.7" stroke-width="2"/>
    <text x="600" y="198" font-size="32" font-weight="500" letter-spacing="20" fill="#CFE2FF">MEDIA</text>
    <line x1="840" y1="186" x2="928" y2="186" stroke="#7FB6FF" stroke-opacity="0.7" stroke-width="2"/>

    <text x="470" y="248" font-size="22" font-weight="500" letter-spacing="6" fill="#E6F0FF">MARKET <tspan class="dot" fill="#3B9BFF">●</tspan> GROW <tspan class="dot" fill="#3B9BFF">●</tspan> SCALE</text>

    <text x="470" y="292" font-size="24" font-weight="600" fill="#FFFFFF">Websites that sell. Marketing that gets you found.</text>
    <text x="470" y="322" font-size="16" font-weight="400" fill="#9CC3FF">Web design, SEO and social media for businesses in Malaysia and Indonesia</text>

    <!-- services ticker -->
    <rect y="344" width="1280" height="56" fill="#041132" fill-opacity="0.7"/>
    <line x1="0" y1="344" x2="1280" y2="344" stroke="#3B9BFF" stroke-opacity="0.35"/>
    <g class="ticker">
      <text x="0" y="379" font-size="18" font-weight="500" fill="#CFE2FF" textLength="1400" lengthAdjust="spacing" xml:space="preserve">Websites that sell  •  SEO that ranks on Google  •  Online stores  •  Social media content  •  Google Business Profile  •  English and Bahasa Malaysia  •  </text>
      <text x="1400" y="379" font-size="18" font-weight="500" fill="#CFE2FF" textLength="1400" lengthAdjust="spacing" xml:space="preserve">Websites that sell  •  SEO that ranks on Google  •  Online stores  •  Social media content  •  Google Business Profile  •  English and Bahasa Malaysia  •  </text>
    </g>
  </g>
</svg>
